
name: Build VirtualDJ Plugin DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          & $msbuild DJMugumyaProSoundEnhancer.sln /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DJMugumyaProSoundEnhancer64-Windows
          path: bin/x64/Release/DJMugumyaProSoundEnhancer64.dll
          if-no-files-found: error
